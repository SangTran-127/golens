<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GoLens DMG Background</title>
<style>
  :root {
    --w: 660px;
    --h: 420px;
    --app-x: 170px;
    --apps-x: 490px;
    --icon-y: 200px;
    --type: #4CC9EB;
    --label-pill: rgba(15, 23, 42, 0.78);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    position: relative;
    background-color: #111827;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  .backdrop {
    position: absolute;
    inset: 0;
    width: var(--w);
    height: var(--h);
    object-fit: cover;
    display: block;
  }
  .glass {
    position: absolute;
    left: 50%;
    top: 20px;
    transform: translateX(-50%);
    padding: 10px 22px 11px;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.06));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34), inset 0 -1px 0 rgba(255, 255, 255, 0.06), 0 8px 24px rgba(0, 0, 0, 0.40);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #F5F5F7;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .glass b { color: var(--type); font-weight: 700; }
  .scene { position: absolute; inset: 0; width: var(--w); height: var(--h); }
  .pill {
    position: absolute;
    top: calc(var(--icon-y) + 70px);
    height: 22px;
    width: 118px;
    margin-left: -59px;
    border-radius: 11px;
    background: var(--label-pill);
    border: 1px solid rgba(255, 255, 255, 0.14);
  }
  .pill.app { left: var(--app-x); }
  .pill.apps { left: var(--apps-x); }
</style>
</head>
<body>
  <img class="backdrop" src="../../../design/mascot/preview/duckoo-dmg-installer.png" alt="">

  <div class="glass">Drag <b>GoLens</b> to Applications</div>

  <svg class="scene" viewBox="0 0 660 420" aria-hidden="true">
    <path d="M 258 192 C 302 150, 358 150, 402 188" fill="none" stroke="#0F172A" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round" stroke-dasharray="0.1 11"/>
    <path d="M 384 184 L 405 191 L 402 169" fill="none" stroke="#0F172A" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 258 192 C 302 150, 358 150, 402 188" fill="none" stroke="#F5F5F7" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 11"/>
    <path d="M 384 184 L 405 191 L 402 169" fill="none" stroke="#F5F5F7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="pill app"></div>
  <div class="pill apps"></div>
</body>
</html>
