apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  labels:
    app: echo
    golens.smoke: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
        golens.smoke: "1"
    spec:
      containers:
        - name: echo
          image: busybox:1.36
          command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo golens-smoke-echo line $i; sleep 2; done"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash
  labels:
    app: crash
    golens.smoke: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash
  template:
    metadata:
      labels:
        app: crash
        golens.smoke: "1"
    spec:
      containers:
        - name: crash
          image: busybox:1.36
          command: ["sh", "-c", "echo golens-smoke-crash starting; echo golens-smoke-crash failing on purpose; exit 1"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
