apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    golens.smoke: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        golens.smoke: "1"
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  labels:
    golens.smoke: "1"
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
